# Astro's official GitHub Pages workflow: builds on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Temporary: build for the project URL https://cooperkole.github.io/tcrg-website/.
    # DELETE these env lines in the same commit as connecting the custom domain (DEPLOY.md, step 4).
    env:
      SITE_URL: https://cooperkole.github.io
      BASE_PATH: /tcrg-website
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
